<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Sidebar with Vertical Scrolling Content</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        .main-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            background-color: white;
            color: black;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 30%;
            flex-shrink: 0; 
        }

        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .content-slide {
            min-height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            font-size: 2em;
            color: white;
            justify-content: center;
            align-items: center;
             min-width: 0;
        }

        .content-wrapper, .sidebar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .content-wrapper::-webkit-scrollbar, .sidebar::-webkit-scrollbar {
            display: none;
        }

        .content-slide:nth-of-type(2) { background-color: #f00 !important; }
        .content-slide:nth-of-type(3) { background-color: #0f0 !important; }
        .content-slide:nth-of-type(4) { background-color: #00f !important; }

        .navbar-custom {
            transition: background-color 0.3s ease;
        }

        .navbar-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }

        .sidebar-content {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100%;
        }

        .sidebar-text {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
        }

        .question-everything-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
        }

        .question-everything {
            font-size: 2em;
            text-align: right; 
            width: 100%; 
        }

        .slide-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .agency-description-container {
            display: flex;
            align-items: flex-start;
            width: 100%;
        }

        .agency-description {
            font-size: 1em;
            color: white;
            text-align: left;
            padding: 20px;
            max-width: 800px;
        }

        .navbar {
            background-color: transparent !important;
        }

        .navbar .container {
            background-color: transparent !important;
            display: flex;
            justify-content: flex-end;
        }

        .navbar-expand-lg {
            background-color: transparent !important;
        }

        .navbar-nav {
            margin-left: auto;
        }

        .navbar-nav .nav-link {
            color: white !important;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <a class="navbar-brand me-2" href="#">Navbar</a>
        <div class="sidebar" id="sidebar-content">
            <div class="sidebar-content">
                <div class="sidebar-text" id="sidebar-text">
                    <div class="question-everything-container">
                        <div class="question-everything">Question everything</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-wrapper" id="content-wrapper">
            <div class="navbar-wrapper">
                <nav class="navbar navbar-expand-lg navbar-custom">
                    <div class="container">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="#">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Features</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Pricing</a>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
            <div class="content-slide" data-nav-color="#f00" style="margin-bottom: -2%;">
                <div class="slide-content">
                    <div class="agency-description-container">
                        <div class="agency-description">
                            We're a web design and digital marketing agency based in Washington, DC. <br>
                            Our strategic approach helps our clients answer their toughest questions.
                        </div>
                    </div>
                </div>
            </div>
            <div class="content-slide" data-nav-color="#0f0" style="margin-bottom: -2%;">Slide 2 Content</div>
            <div class="content-slide" data-nav-color="#00f" style="margin-bottom: -2%;">Slide 3 Content</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebarText = document.getElementById('sidebar-text');
        const slides = document.querySelectorAll('.content-slide');

        document.getElementById('content-wrapper').addEventListener('scroll', () => {
            slides.forEach((slide, index) => {
                const rect = slide.getBoundingClientRect();
                if (rect.top >= 0 && rect.top < window.innerHeight / 2) {
                    if (index === 1) {
                        sidebarText.innerHTML = `<div class="question-everything-container"><div class="question-everything">Hello World</div></div>`;
                    }
                    if(index===0){
                        sidebarText.innerHTML = `<div class="question-everything-container"><div class="question-everything">Question everything</div></div>`;
                    }
                }
            });
        });
    </script>
</body>
</html>
