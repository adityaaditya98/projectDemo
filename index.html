<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed Sidebar with Vertical Scrolling Content</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body, html {
        height: 100%;
        margin: 0;
    }

    .container-wrapper {
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    .sidebar {
        width: 300px;
        background-color: white;
        padding: 20px;
        position: fixed;
        top: 56px;
        left: 0;
        height: calc(100% - 56px);
        overflow-y: auto;
    }

    .content-wrapper {
        flex: 1;
        margin-left: 300px;
        height: 100vh;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
    }

    .content-slide {
        min-height: 100vh;
        scroll-snap-align: start;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2em;
        color: white;
    }
    .content-wrapper, .sidebar {
    -ms-overflow-style: none; 
    scrollbar-width: none; 
}

.content-wrapper::-webkit-scrollbar, .sidebar::-webkit-scrollbar {
    display: none;
}

    .content-slide:nth-child(1) { background-color: #f00; }
    .content-slide:nth-child(2) { background-color: #0f0; }
    .content-slide:nth-child(3) { background-color: #00f; }
</style>
</head>
<body>
<div>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand me-2" href="#">Navbar</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Features</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Pricing</a>
            </li>
        </ul>
    </div>
</nav>
<div class="container-wrapper">
    <div class="sidebar" id="sidebar-content">
        <div id="sidebar-text">
            Question everything<br><br>
            We're a web design and digital marketing agency based in Washington, DC.<br><br>
            Our strategic approach helps our clients answer their toughest questions.
        </div>
    </div>

    <div class="content-wrapper" id="content-wrapper">
        <div class="content-slide">Slide 1 Content</div>
        <div class="content-slide">Slide 2 Content</div>
        <div class="content-slide">Slide 3 Content</div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const sidebarText = document.getElementById('sidebar-text');
    const slides = document.querySelectorAll('.content-slide');
    
    document.getElementById('content-wrapper').addEventListener('scroll', () => {
        slides.forEach((slide, index) => {
            const rect = slide.getBoundingClientRect();
            if (rect.top >= 0 && rect.top < window.innerHeight / 2) {
                if (index === 1) {
                    sidebarText.innerHTML = "Hello World";
                }
                if(index===0){
                    sidebarText.innerHTML = " Question everything<br><br> Were a web design and digital marketing agency based in Washington, DC.<br><br> Our strategic approach helps our clients answer their toughest questions.";
                }
            }
        });
    });
</script>

</body>
</html>
