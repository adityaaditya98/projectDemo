<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Scrolling Content</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }

        .firstPage {
            display: flex;
            height: 100vh;
            overflow: hidden; /* Prevent scrollbars on firstPage */
        }

        .mainContent { /* Wrapper for the scrolling content */
            flex: 1; /* Takes up all available space */
            height: 100vh; /* Content wrapper takes full viewport height */
            overflow-y: auto; /* Enable vertical scrolling */
            scroll-snap-type: y mandatory; /* Enable vertical scroll snapping */
        }

        .main-slide { /* Individual content slides */
            min-height: 100vh; /* Each slide takes full viewport height */
            scroll-snap-align: start; /* Snap to the top of each slide */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
        }

        /* Example slide background colors (replace with your content) */
        .main-slide:nth-child(1) { background-color: #f00; }
        /* ... more colors as needed */

    </style>
</head>
<body>
    <div class="firstPage">
        <div class="mainContent">
            <div class="main-slide">Slide 1 Content</div>
            <div class="main-slide">Slide 1 Content</div>
        </div>
    </div>
</body>
</html>
